<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'; worker-src 'self'">
<meta name="referrer" content="no-referrer">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#091214">
<title>قارئ سَكينة</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/css/fonts.css">
<link rel="stylesheet" href="../assets/css/style.css?v=2">
<link rel="stylesheet" href="../assets/css/reader.css?v=1">
</head>
<body>
<div class="glow" aria-hidden="true"></div>

<!-- lock screen -->
<main class="gate" id="gate">
  <form class="gate-card" id="gateForm" novalidate>
    <div class="gate-moon" aria-hidden="true"></div>
    <h1>قارئ سَكينة</h1>
    <p>اكتب رمز القارئ لتفتح الكتاب. تجده في الصفحة الرابعة من ملف الكتاب الذي حمّلته بعد الشراء.</p>
    <label class="sr" for="code">رمز القارئ</label>
    <input id="code" dir="ltr" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="SKN-XXXX-XXXX-XXXX" maxlength="24">
    <label class="remember"><input type="checkbox" id="remember" checked> تذكّر الرمز على هذا الجهاز</label>
    <p class="gate-err" id="gateErr" hidden></p>
    <div class="load" id="load" hidden><i id="loadBar"></i></div>
    <button class="btn btn-moon" type="submit" id="openBtn">افتح الكتاب</button>
    <a class="gate-link" href="../buy/">لم تقتنِ الكتاب بعد؟ اقتنِه من هنا</a>
  </form>
</main>

<!-- reader -->
<div class="reader" id="reader" hidden>
  <header class="r-top">
    <a class="r-brand" href="../"><span class="moon-dot"></span>سَكينة</a>
    <span class="r-page" id="pageLabel" aria-live="polite"></span>
    <div class="r-tools">
      <button class="r-btn" type="button" id="tocBtn" aria-expanded="false" aria-controls="toc" title="الفهرس"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>الفهرس</span></button>
      <button class="r-btn" type="button" id="fsBtn" title="ملء الشاشة" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="r-btn" type="button" id="lockBtn" title="خروج"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
    </div>
  </header>

  <nav class="toc" id="toc" hidden aria-label="فهرس الكتاب">
    <ol id="tocList"></ol>
  </nav>

  <div class="stage" id="stage">
    <button class="nav-zone prev" type="button" id="prevZone" aria-label="الصفحة السابقة"></button>
    <div class="book" id="book" aria-label="صفحات الكتاب">
      <div class="half right" id="baseR"></div>
      <div class="half left" id="baseL"></div>
      <div class="spine" aria-hidden="true"></div>
    </div>
    <button class="nav-zone next" type="button" id="nextZone" aria-label="الصفحة التالية"></button>
  </div>

  <footer class="r-bottom">
    <button class="r-arrow" type="button" id="prevBtn" aria-label="الصفحة السابقة">→</button>
    <input type="range" id="slider" min="1" max="46" value="1" aria-label="انتقل إلى صفحة">
    <button class="r-arrow" type="button" id="nextBtn" aria-label="الصفحة التالية">←</button>
  </footer>
  <p class="r-hint" id="hint">اسحب الصفحة أو اكبس على طرفها لتقلبها</p>
</div>

<script src="../assets/js/reader.js?v=1"></script>
</body>
</html>

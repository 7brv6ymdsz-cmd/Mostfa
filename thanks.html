<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; script-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#091214">
<title>شكراً لك · سَكينة</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/fonts.css">
<style>
html,body{margin:0;min-height:100%;background:#091214;color:#EDE6D6;font-family:"Noto Naskh Arabic",serif}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:32px max(20px,env(safe-area-inset-left,0px))}
.moon{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#FBF6EA,#E6DCC6 45%,#BFB49E);box-shadow:0 0 60px 10px rgba(237,230,214,.18)}
h1{font-family:"Aref Ruqaa",serif;font-size:clamp(2.6rem,9vw,4rem);margin:0;line-height:1.3}
p{color:#9DAEA8;font-size:1.2rem;margin:0;max-width:34ch;line-height:1.9}
.box{border:1px solid rgba(237,230,214,.12);border-radius:16px;padding:18px 22px;font-family:"IBM Plex Sans Arabic",sans-serif;font-size:.95rem;color:#EDE6D6;max-width:420px;line-height:1.9}
a{display:inline-block;margin-top:6px;padding:14px 30px;border-radius:999px;background:#EDE6D6;color:#091214;text-decoration:none;font-family:"IBM Plex Sans Arabic",sans-serif}
</style>
</head>
<body>
<main>
  <div class="moon" aria-hidden="true"></div>
  <h1>شكراً لك</h1>
  <p>وصل دفعك بنجاح. أنت الآن على أول الطريق.</p>
  <div class="box">📩 يصلك كتاب «سَكينة» على بريدك الإلكتروني خلال ٢٤ ساعة.<br>إن لم تجده، تفقّد مجلد الرسائل غير المرغوبة.</div>
  <a href="./">العودة إلى سَكينة</a>
</main>
</body>
</html>
